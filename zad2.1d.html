<!DOCTYPE html>
<html>
<head>
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Image of product in cart">
        <p>Product Name: Example Product</p>
        <p>Price: $49.99</p>
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Name on Card:</label>
            <input id="card-name" name="card-name" type="text" aria-required="true" required>
            <br>
            <label for="card-number">Card Number:</label>
            <input id="card-number" name="card-number" type="text" aria-required="true" required>
            <br>
            <input type="submit" value="Submit Payment">
        </form>
    </section>
</body>
</html>
