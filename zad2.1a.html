<!DOCTYPE html>
<html>
<head>
    <title>Hotel Feedback Form</title>
</head>
<body>
    <h1>Hotel Feedback Form</h1>
    <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name (required):</label>
            <input type="text" id="name" name="name" placeholder="Ex. John Doe" required>
            <br>
            <label for="email">Email address (required):</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
            <br>
            <label for="age">Age (optional):</label>
            <input type="number" id="age" name="age">
        </fieldset>
        <fieldset>
            <legend>Was this your first time at our hotel?</legend>
            <input type="radio" id="yes" name="first_time" value="yes">
            <label for="yes">Yes</label>
            <input type="radio" id="no" name="first_time" value="no">
            <label for="no">No</label>
        </fieldset>
        <fieldset>
            <legend>Why did you choose to stay at our hotel? (Check all that apply)</legend>
            <input type="checkbox" id="social_media_ads" name="reason" value="social_media_ads">
            <label for="social_media_ads">Social Media Ads</label>
            <input type="checkbox" id="personal_recommendation" name="reason" value="personal_recommendation">
            <label for="personal_recommendation">Personal Recommendation</label>
            <input type="checkbox" id="location" name="reason" value="location">
            <label for="location">Location</label>
            <input type="checkbox" id="reputation" name="reason" value="reputation">
            <label for="reputation">Reputation</label>
            <input type="checkbox" id="price" name="reason" value="price">
            <label for="price">Price</label>
        </fieldset>
        <fieldset>
            <legend>Ratings</legend>
            <label for="service">How was the service?</label>
            <select id="service" name="service">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average">Average</option>
                <option value="poor">Poor</option>
            </select>
            <br>
            <label for="food">How was the food?</label>
            <select id="food" name="food">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average">Average</option>
                <option value="poor">Poor</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Other Comments?</legend>
            <textarea id="comments" name="comments" rows="4" cols="50"></textarea>
        </fieldset>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
