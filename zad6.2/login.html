<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Methods Demo</title>
    <style>
        .form-group { margin-bottom: 1rem; }
        .button-group { margin-top: 1rem; }
        button { margin-right: 0.5rem; }
    </style>
</head>
<body>
    <form id="loginForm" action="/login" method="POST">
        <div class="form-group">
            <label for="username">Nazwa użytkownika:</label>
            <input type="text" id="username" name="username" required 
                   value="<%= username %>">
        </div>
        <div class="form-group">
            <label for="password">Hasło:</label>
            <input type="password" id="password" name="password" 
                   required minlength="8">
        </div>
        <div class="button-group">
            <button type="submit">Zaloguj (POST)</button>
            <a href="/user?method=GET"><button type="button">GET</button></a>
            <a href="/user?method=PUT"><button type="button">PUT</button></a>
            <a href="/user?method=DELETE"><button type="button">DELETE</button></a>
        </div>
    </form>
</body>
</html>
