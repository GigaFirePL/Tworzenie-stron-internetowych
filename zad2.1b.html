<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please fill out this survey to help us improve our services.</p>

    <form id="survey-form">
        <label id="name-label" for="name">Name:</label>
        <input id="name" type="text" placeholder="Enter your name" required>

        <label id="email-label" for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter your email" required>

        <label id="number-label" for="number">Age:</label>
        <input id="number" type="number" placeholder="Enter your age" min="18" max="100">

        <label for="dropdown">Select your country:</label>
        <select id="dropdown">
            <option value="poland">Poland</option>
            <option value="germany">Germany</option>
        </select>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <p>Interests:</p>
        <input type="checkbox" id="sports" name="interest" value="sports">
        <label for="sports">Sports</label>
        <input type="checkbox" id="music" name="interest" value="music">
        <label for="music">Music</label>

        <label for="comments">Additional Comments:</label>
        <textarea id="comments" placeholder="Enter your comments"></textarea>

        <button id="submit" type="submit">Submit</button>
    </form>
</body>
</html>
